name: podcast sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    env:
        NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        NOTION_PAGE: ${{ secrets.NOTION_PAGE }}
        REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        COOKIE: ${{ secrets.TONGYI_COOKIE }}
        YEAR: ${{ vars.YEAR }}
        REF: ${{ github.ref }}
        REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install .
      - name: podcast sync
        run: |
          podcast
      - name: Set default year if not provided
        # 默认上一年（since 用户听过播客的 playedAt 多数在历史年份；
        # 跨年后才会切到当前年，避免空热力图）
        run: echo "YEAR=$(date -u -d 'last year' +"%Y")" >> $GITHUB_ENV
        if: env.YEAR == ''
      - name: notion heatmap
        run: |
          github_heatmap notion  --notion_token "${{secrets.NOTION_TOKEN}}" --database_id "${{ env.EPISODE_DATABASE_ID }}" --date_prop_name "日期" --value_prop_name "时长" --unit "秒" --year $YEAR  --me "${{secrets.NAME}}" --without-type-name --background-color=${{ vars.background_color||'#FFFFFF'}} --track-color=${{ vars.track_color||'#ACE7AE'}} --special-color1=${{ vars.special_color||'#69C16E'}} --special-color2=${{ vars.special_color2||'#549F57'}} --dom-color=${{ vars.dom_color||'#EBEDF0'}} --text-color=${{ vars.text_color||'#000000'}}
      - name: Rename notion.svg to a random name
        run: |
          cd OUT_FOLDER
          find . -type f ! -name "notion.svg" -exec rm -f {} +
          cd ..
          RANDOM_FILENAME=$(uuidgen).svg
          mv ./OUT_FOLDER/notion.svg ./OUT_FOLDER/$RANDOM_FILENAME
          echo "Renamed file to $RANDOM_FILENAME"
      - name: push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m 'add new heatmap' || echo "nothing to commit"
          git push || echo "nothing to push"
      - name: udpate heatmap
        run: |
            update_heatmap
      - name: debug episode database (temporary)
        if: always()
        run: |
          python3 -c "
import os
from podcast2notion.notion_helper import NotionHelper
nh = NotionHelper()
ep = nh.episode_database_id
print(f'EPISODE_DATABASE_ID={ep}')
r = nh.client.databases.retrieve(database_id=ep)
print('properties:', list(r.get('properties', {}).keys()))
# 查 2025 年有日期的 episode
resp = nh.client.databases.query(
    database_id=ep,
    filter={'property':'日期','date':{'on_or_after':'2025-01-01'}},
    page_size=5
)
print('2025-or-later count (page 1):', len(resp['results']), 'has_more:', resp.get('has_more'))
for i, p in enumerate(resp['results']):
    props = p.get('properties', {})
    date_prop = props.get('日期', {}).get('date')
    dur_prop = props.get('时长', {})
    print(f'  [{i}] 日期={date_prop}, 时长={dur_prop}')
"
